# ===========================================================================
# Render blueprint - the hosted, publicly reachable deployment.
#
#   1. push this repo to GitHub
#   2. Render -> New -> Blueprint -> pick the repo
#   3. set OLLAMA_API_KEY (and QDRANT_URL / QDRANT_API_KEY for Qdrant Cloud)
#
# The free tier has no persistent disk and sleeps after inactivity, which is
# why the container re-indexes on boot: a cold start rebuilds the index from
# data/markdown in a few seconds rather than depending on a volume.
# ===========================================================================
services:
  - type: web
    name: atlas-rag
    runtime: docker
    plan: free
    region: singapore
    rootDir: atlas-rag
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: BUILD_PROFILE
        value: min                    # free tier RAM cannot hold the full ML stack
      - key: APP_ENV
        value: production
      - key: APP_PORT
        value: "8000"
      - key: VECTOR_BACKEND
        value: qdrant
      - key: EMBED_PROVIDER
        value: huggingface
      - key: LOG_LEVEL
        value: INFO
      - key: OLLAMA_BASE_URL
        value: https://ollama.com
      - key: OLLAMA_CHAT_MODEL
        value: gpt-oss:120b
      - key: OLLAMA_API_KEY
        sync: false                   # set in the Render dashboard, never in git
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
